[project]
name = "icechest"
version = "0.1.0"
description = "Hybrid Icechunk/Iceberg store: array data and tabular metadata in one commit"
authors = [{ name = "Sean Harkins", email = "sean@developmentseed.org" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.1",
    "pyiceberg>=0.11",
    "pyarrow>=21",
    "zarr>=3",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icechest"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
