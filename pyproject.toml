[project]
name = "icechest"
version = "0.1.0"
description = "Hybrid Icechunk/Iceberg store: array data and tabular metadata in one commit"
authors = [{ name = "Sean Harkins", email = "sean@developmentseed.org" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.1",
    # Pinned below 0.12: validation.py depends on private helpers whose
    # argument orientation contradicts their docstrings.
    "pyiceberg>=0.11,<0.12",
    "pyarrow>=21",
    "zarr>=3",
    "numpy>=2",
]

[project.optional-dependencies]
demo = [
    "virtualizarr>=2.7",
    "virtual-tiff>=0.5",
    "obstore>=0.11",
    "obspec-utils>=0.9",
    "stac-hash>=0.0.2",
    # Partitioned writes compute the partition transform in PyIceberg's
    # Rust extension, which is an optional install.
    "pyiceberg-core>=0.10",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icechest"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits live services (MAAP archive, Earthdata, LP DAAC); deselected by default",
]
addopts = "-m 'not network'"
